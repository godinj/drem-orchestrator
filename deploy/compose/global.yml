# Global infrastructure compose for drem-orchestrator — Phase 1.
#
# Brings up the shared services every per-project compose depends on:
#   - registry: host-local Docker image registry (localhost:5000)
#   - sglang:   GPU-backed LLM server
#   - gq:       admission-control proxy in front of SGLang
#
# Per docs/prd-containerization.md §Compose topology (Global compose) and
# §Phased rollout step 1. Downstream per-project composes (owned by prompt 05)
# attach to the external `drem-net` network created by network-setup.sh and
# pull images from localhost:5000.
#
# Operator prerequisites:
#   1. Docker + nvidia-container-toolkit installed on host.
#   2. External network created once:  bash deploy/compose/network-setup.sh
#   3. Host-side SGLang model dir exists (default $HOME/sglang-models).
#   4. Optional gq config at ~/.drem-csuite/gq.toml (defaults apply if absent).
#
# Bring up:   docker compose -f deploy/compose/global.yml up -d
# Tear down:  docker compose -f deploy/compose/global.yml down
#
# See deploy/compose/README.md for the full operational runbook.

name: drem-global

networks:
  drem-net:
    external: true
    name: drem-net

volumes:
  drem-registry-data:
    name: drem-registry-data
  drem-spawner-sock:
    name: drem-spawner-sock

services:
  # ---------- Local Docker registry ----------
  # Unauthenticated, bound to 127.0.0.1 only. Every drem-* image is pushed
  # here manually today: `docker push localhost:5000/drem-<component>:<tag>`.
  # Do NOT expose to the external drem-net; only the loopback port mapping
  # is needed since clients push from the host.
  registry:
    image: registry:2
    container_name: drem-registry
    restart: unless-stopped
    networks:
      - drem-net
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - drem-registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    labels:
      drem.scope: "global"
      drem.service: "registry"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/v2/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- SGLang: GPU-backed LLM server ----------
  # Listens on :8081 inside the drem-net network; also published on
  # 127.0.0.1:8081 during the transition so host callers still resolve.
  # Model weights are bind-mounted from the host (50+ GB; must not enter
  # an image layer). GPU access is mandatory — requires nvidia-container-toolkit.
  sglang:
    build:
      context: ../..
      dockerfile: deploy/docker/sglang.Dockerfile
      # No build args: the image is fully pinned via
      # deploy/docker/context/sglang-requirements.txt (a frozen pip
      # lock from the host venv) and the six patches under
      # deploy/docker/context/sglang-patches/. See the Dockerfile
      # preamble for the reproduction strategy.
    image: localhost:5000/drem-sglang:latest
    container_name: drem-sglang
    restart: unless-stopped
    networks:
      - drem-net
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - type: bind
        source: ${SGLANG_MODEL_DIR:-${HOME}/sglang-models}
        target: /models
        read_only: true
    # Launch command pulled out of the Dockerfile so operators can swap models
    # without rebuilding. Host-varying bits (model dir, weights subdir, served
    # name, per-host tuning) come from deploy/compose/.env — see
    # deploy/compose/.env.example for the full knob list. Flags that are
    # gemma4-specific tuning (KV dtype, SWA ratio, attention/sampling backend,
    # tool-call parser) are hardcoded here because swapping them amounts to
    # swapping model families, which warrants a code change, not a config flip.
    # The image now ships a customized SGLang built from upstream git +
    # gemma4 patches (see plans/sglang-gemma4-followup.md), so the gemma4
    # parser is natively supported.
    # Mirrors the host-side launcher documented in
    # plans/host-state-inventory.md §1.1.
    #
    # NOTE: the image's ENTRYPOINT is `python -m sglang.launch_server`,
    # so this `command:` supplies ARGS ONLY — do not re-prefix with the
    # interpreter invocation or argparse will reject the duplicated
    # tokens as unrecognized positional args.
    command: >
      --host 0.0.0.0 --port 8081
      --model-path /models/${SGLANG_MODEL_SUBDIR:-gemma4-26b}
      --served-model-name ${SGLANG_SERVED_NAME:-gemma4-26b}
      --context-length ${SGLANG_CONTEXT_LENGTH:-131072}
      --mem-fraction-static ${SGLANG_MEM_FRACTION:-0.85}
      --max-running-requests ${SGLANG_MAX_REQUESTS:-4}
      --tp ${SGLANG_TP:-1}
      --kv-cache-dtype fp8_e5m2
      --swa-full-tokens-ratio 0.08
      --attention-backend triton
      --sampling-backend pytorch
      --disable-piecewise-cuda-graph
      --tool-call-parser gemma4
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      drem.scope: "global"
      drem.service: "sglang"
    healthcheck:
      # Image base is sglang:devel (CUDA toolchain incl. curl). wget is NOT
      # installed in :devel — using wget here flips the container to
      # (unhealthy) even when the server is serving 200s. Use curl instead.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # cold model load can take a while

  # ---------- GQ: admission-control proxy in front of SGLang ----------
  # Resolves upstream by compose service name (sglang:8081). Proxy + metrics
  # ports are published to loopback so host-side callers (during the Phase 1
  # transition) can still reach them. See internal/gq/config.go for defaults.
  gq:
    build:
      context: ../..
      dockerfile: deploy/docker/gq.Dockerfile
    image: localhost:5000/drem-gq:latest
    container_name: drem-gq
    restart: unless-stopped
    networks:
      - drem-net
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:8091:8091"
    environment:
      GQ_BIND_ADDR: 0.0.0.0:8090
      GQ_METRICS_ADDR: 0.0.0.0:8091
      GQ_UPSTREAM: http://sglang:8081
      # Additional overrides — defaults from internal/gq/config.go:124-166.
      # GQ_MAX_SLOTS: "4"
      # GQ_QUEUE_MAX_DEPTH: "128"
    volumes:
      - type: bind
        source: ${HOME}/.drem-csuite/gq.toml
        target: /etc/gq/gq.toml
        read_only: true
        bind:
          # gq has working defaults; don't fail the stack if the file is absent.
          create_host_path: false
    depends_on:
      sglang:
        condition: service_healthy
    labels:
      drem.scope: "global"
      drem.service: "gq"
    # NOTE: no healthcheck. The gq runtime image is distroless/static
    # (gcr.io/distroless/static-debian12:nonroot) — no shell, no wget, no curl.
    # A CMD-SHELL healthcheck would fail immediately; a plain CMD needs an
    # executable in the image, which means either (a) switching off distroless
    # or (b) adding a `gq healthz` subcommand to the Go binary and running
    # `CMD ["/usr/local/bin/gq", "healthz"]`. (b) is the clean fix — tracked in
    # plans/sglang-gemma4-followup.md "Open follow-ups". Until then we rely on
    # `restart: unless-stopped` + the proxy's own /metrics surface for liveness.

  # ---------- Spawner: JSON-RPC Docker-socket gateway ----------
  # The only process in the stack mounted with the host Docker socket.
  # Every other service (orchestrator, agentmon) talks to it over a Unix
  # socket in the shared drem-spawner-sock volume. Per PRD §"Spawner
  # service owns the Docker socket" this is an intentionally narrow
  # privilege boundary.
  spawner:
    image: localhost:5000/drem-spawner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - drem-spawner-sock:/var/run/drem
    networks: [drem-net]
    restart: unless-stopped
    labels:
      drem.scope: global
      drem.service: spawner

  # ---------- Kyle: C-Suite reporting agent ----------
  # Polls every registered project's orchestrator HTTP API and serves a
  # unified read-only view. Read-only by construction: Kyle never writes
  # to any orchestrator's SQLite database. See internal/kyle/service.go
  # and docs/prd-containerization.md for the rationale.
  #
  # The host-wide registry (~/.drem/projects.toml) is bind-mounted read
  # only; Kyle reads it at startup to discover the set of orchestrators
  # to poll.
  #
  # Host port note: gq already occupies 127.0.0.1:8090 on the loopback,
  # so Kyle's internal :8090 is published as :8095 on the host. Inside
  # drem-net callers still resolve by service name (kyle:8090).
  kyle:
    image: localhost:5000/drem-kyle:latest
    container_name: drem-kyle
    restart: unless-stopped
    networks: [drem-net]
    volumes:
      - ${HOME}/.drem/projects.toml:/etc/drem/projects.toml:ro
    ports:
      - "127.0.0.1:8095:8090"
    depends_on:
      - docker-query-proxy
    labels:
      drem.scope: global
      drem.service: kyle

  # ---------- drem-classifier: warm direct-classifier ----------
  # Serves POST /classify for orch when [agents.classifier].endpoint is set
  # in a project's drem.toml. Single replica, stateless — the binary just
  # wraps agent.Classify behind an HTTP surface and forwards upstream to gq.
  # See plans/warm-direct-classifier.md for the design.
  #
  # Resolves upstream by compose service name (gq:8090). Not published to
  # any host port: orch reaches it via drem-net as http://drem-classifier:8090.
  # Healthcheck probes /healthz, which in turn probes gq — so an unhealthy
  # classifier container means either the binary is down or gq can't be
  # reached.
  drem-classifier:
    build:
      context: ../..
      dockerfile: deploy/docker/classifier.Dockerfile
    image: localhost:5000/drem-classifier:latest
    container_name: drem-classifier
    restart: unless-stopped
    networks:
      - drem-net
    environment:
      DREM_CLASSIFIER_LISTEN: ":8090"
      DREM_CLASSIFIER_UPSTREAM: "http://gq:8090/v1/chat/completions"
      DREM_CLASSIFIER_MODEL: "${DREM_CLASSIFIER_MODEL:-gemma4-26b}"
      DREM_CLASSIFIER_TIMEOUT: "${DREM_CLASSIFIER_TIMEOUT:-60s}"
      # Bearer token shared with orch — same convention as merger and
      # csuite-watcher. Empty on dev hosts without agentmon; the binary
      # falls open on missing-token when the env is unset.
      DREM_AGENTMON_TOKEN: "${DREM_AGENTMON_TOKEN:-}"
    depends_on:
      sglang:
        condition: service_healthy
    labels:
      drem.scope: "global"
      drem.service: "drem-classifier"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------- drem-planner: warm HTTP planner ----------
  # Serves POST /plan for orch when a task reaches PLANNING with
  # provider=claude. Single replica, stateless between requests — the
  # binary execs the `claude` CLI as a subprocess per /plan call and
  # returns the resulting plan.json inline in the HTTP response. See
  # plans/warm-planner-pivot.md for the design.
  #
  # Auth is subscription-only: ~/.claude/.credentials.json is bind-mounted
  # read-only from the host operator's home into /home/drem/.claude. Host
  # operator owns OAuth refresh via `claude login`; the container reads
  # fresh creds on each /plan call. Planner /healthz validates the file
  # is readable AND `claude --version` returns in <2s; failures flip the
  # compose healthcheck to unhealthy so orch dispatch can fail fast on
  # /healthz probe before eating a 5-minute claude timeout.
  #
  # No ANTHROPIC_API_KEY passthrough. Per operator direction 2026-04-20:
  # subscription-only, so all claude-backed roles share the Max
  # rate-limit pool.
  drem-planner:
    build:
      context: ../..
      dockerfile: deploy/docker/planner.Dockerfile
    image: localhost:5000/drem-planner:latest
    container_name: drem-planner
    restart: unless-stopped
    networks:
      - drem-net
    environment:
      DREM_PLANNER_LISTEN: ":8090"
      # Bearer token shared with orch — same convention as classifier and
      # merger. Empty on dev hosts without agentmon; the binary falls
      # open on missing-token when the env is unset.
      DREM_AGENTMON_TOKEN: "${DREM_AGENTMON_TOKEN:-}"
    volumes:
      # Read-only bind-mount of the operator's Claude subscription creds.
      # Mirrors the csuite agents pattern (compose.override.yml in
      # ~/.drem/projects/drem-orchestrator/). Read-only so the container
      # can't write refresh tokens the host then has to reconcile — host
      # claude CLI interactive sessions own refresh; container just reads.
      - type: bind
        source: ${HOME}/.claude/.credentials.json
        target: /home/drem/.claude/.credentials.json
        read_only: true
    labels:
      drem.scope: "global"
      drem.service: "drem-planner"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------- docker-query-proxy: narrow Docker-socket gateway for Kyle ----------
  # Exposes an allowlisted HTTP API (GET /containers, GET /containers/:id,
  # GET /containers/:id/logs) over the host Docker socket. Kyle calls this
  # proxy — never the socket directly — so the privilege boundary shows
  # up in the topology: one container owns the socket; Kyle owns reporting.
  docker-query-proxy:
    image: localhost:5000/drem-docker-query-proxy:latest
    container_name: drem-docker-query-proxy
    restart: unless-stopped
    networks: [drem-net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      drem.scope: global
      drem.service: docker-query-proxy
