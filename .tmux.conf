# drem-orchestrator tmux configuration
# Loaded via -f flag; does not affect user's default tmux server.
unbind C-b
set -g prefix C-n
bind C-n send-prefix

bind -n M-n switch-client -l

# Enable mouse support for scrolling and pane selection.
set -g mouse on

# Status bar: blue/cyan theme with [drem] prefix.
set -g status-style "bg=colour24,fg=colour159"
set -g status-left "#[bg=colour31,fg=colour255,bold] [drem] #[default] "
set -g status-left-length 20
set -g status-right "#[fg=colour117]%H:%M "
set -g status-right-length 10

# Active window highlighted in cyan.
set -g window-status-current-style "bg=colour31,fg=colour255,bold"
set -g window-status-style "fg=colour153"

# Pane borders in blue tones.
set -g pane-border-style "fg=colour24"
set -g pane-active-border-style "fg=colour75"

# Message styling.
set -g message-style "bg=colour24,fg=colour255"
