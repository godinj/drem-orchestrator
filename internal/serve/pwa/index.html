<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>C-Suite</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <h1>C-Suite</h1>
    <p>Enter your bearer token to connect to the bridge server.</p>
    <input id="login-token" type="password" placeholder="Bearer token" autocomplete="off">
    <div id="login-error"></div>
    <button id="login-btn">Connect</button>
  </div>

  <!-- App Shell -->
  <div id="app">
    <header>
      <div class="header-top">
        <h1>C-Suite</h1>
        <span id="connection-status" class="connection-status disconnected">Disconnected</span>
      </div>
      <div id="agent-tabs" class="agent-tabs"></div>
    </header>

    <div id="messages-area" class="messages-area">
      <div class="empty-state">Select an agent to view messages.</div>
    </div>

    <div id="quick-actions" class="quick-actions"></div>

    <!-- Quick Actions Configuration Modal -->
    <div id="qa-config-overlay" class="qa-config-overlay hidden">
      <div class="qa-config-modal">
        <div class="qa-config-header">
          <h2>Quick Actions</h2>
          <button id="qa-config-close" class="qa-config-close" aria-label="Close">&#10005;</button>
        </div>
        <div id="qa-config-list" class="qa-config-list"></div>
        <div class="qa-config-footer">
          <button id="qa-config-add" class="qa-config-btn qa-config-btn-add">+ Add Action</button>
          <button id="qa-config-reset" class="qa-config-btn qa-config-btn-reset">Reset to Defaults</button>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <textarea id="msg-input" rows="1" placeholder="Message..." enterkeyhint="send"></textarea>
      <button id="send-btn" aria-label="Send">&#9654;</button>
    </div>
  </div>

  <script src="/app.js"></script>
  <script src="/voice.js"></script>
</body>
</html>
