# Project-agnostic constraint definitions for drem-orchestrator.
# The orchestrator reads this file to enforce quality constraints at:
# - Plan validation (before plan_review)
# - Post-agent checks (before merge into integration)
# - Integration gate (before testing_ready)

context_files = ["ARCHITECTURE.md"]

# ── Commands ──────────────────────────────────────────────────

[[command]]
name   = "gofmt compliance"
run    = "gofmt -l ./internal/ ./cmd/"
expect = "empty_output"

[[command]]
name = "go vet"
run  = "go vet ./..."

# ── File Length ───────────────────────────────────────────────

[[max_lines]]
name    = "File length ceiling"
glob    = "internal/**/*.go"
exclude = ["*_test.go"]
limit   = 800

[[max_lines.exception]]
path           = "internal/orchestrator/orchestrator.go"
rule           = "shrink-only"
baseline_lines = 2250

# ── Symbol Counts ────────────────────────────────────────────

[[max_matches]]
name    = "Exported function count"
glob    = "internal/**/*.go"
exclude = ["*_test.go"]
pattern = "^func [A-Z]"
limit   = 20
scope   = "file"

[[max_matches.exception]]
path           = "internal/orchestrator/orchestrator.go"
rule           = "shrink-only"
baseline_count = 2

[[max_matches]]
name       = "Internal import ceiling"
glob       = "internal/**/*.go"
exclude    = ["*_test.go"]
pattern    = "\".*internal/"
limit      = 6
scope      = "directory"
# count_mode='unique' counts distinct import paths per directory (equivalent to
# sort -u), not total occurrences. This prevents decomposition from being
# penalised: splitting a file into multiple focused files with shared imports
# does not increase the unique import count.
count_mode = "unique"

[[max_matches.exception]]
path           = "internal/orchestrator/"
rule           = "shrink-only"
# Baseline ratcheted 11 → 17 during the gitexec extraction (prompt 18 of the
# containerization follow-up): orchestrator gained internal/gitexec but kept
# internal/worktree (still needed by worktree_manager.go for the interface's
# type aliases). Once prompts 20/21 land and internal/worktree is deleted the
# count will drop back below 11 — but until then this baseline reflects the
# real (decreasing-trending) state. Never increase this number; the next
# ratchet should be downward.
baseline_count = 17

[[max_matches.exception]]
path           = "internal/tui/"
rule           = "shrink-only"
baseline_count = 10

[[max_matches]]
name    = "GORM hook consolidation"
glob    = "internal/model/models.go"
pattern = "func.*BeforeCreate"
limit   = 1

# ── Forbidden Patterns ───────────────────────────────────────

[[no_match]]
name         = "DB init outside testutil"
glob         = "internal/**/*_test.go"
exclude_path = ["internal/testutil/", "internal/model/"]
pattern      = "gorm\\.Open\\(sqlite"

[[no_match]]
name         = "Git helpers outside testutil"
glob         = "internal/**/*_test.go"
exclude_path = ["internal/testutil/"]
pattern      = "func setupBareRepo|func initBareRepo|func addWorktree|func commitFile"

[[no_match]]
name         = "Test factories outside testutil"
glob         = "internal/**/*_test.go"
exclude_path = ["internal/testutil/"]
pattern      = "func createTest|func newTest|func mockTestDB|func lifecycleTestDB"

# ── Module Depth ─────────────────────────────────────────────

[[depth]]
name              = "Export ratio ceiling"
glob              = "internal/**/*.go"
exclude           = ["*_test.go"]
max_export_ratio  = 0.15
max_pass_throughs = 3

[[depth.exception]]
path               = "internal/tui/"
rule               = "grandfathered"
baseline_ratio     = 1.0
baseline_pass_thrus = 100

[[depth.exception]]
path               = "internal/csuite/"
rule               = "grandfathered"
baseline_ratio     = 0.25
baseline_pass_thrus = 5
