bare_repo_path        = "/home/godinj/git/drem-orchestrator.git"
default_branch        = "master"
max_concurrent_agents = 4
opencode_bin              = "opencode"
opencode_context_window   = 98304
llama_server_endpoint     = "http://localhost:8081"
test_command              = "go test ./..."
compile_command       = "go vet ./..."
skip_constraint_gate  = false

[agents.classifier]
  provider = "opencode"
  model    = "sglang/gemma4-26b"
  effort   = "medium"
  direct   = true  # bypass OpenCode, call SGLang API directly

[agents.planner]
  model  = "claude-opus-4-6"
  effort = "medium"

[agents.prep]
  provider = "sglang-direct"
  model    = "gemma4-26b"

[agents.coder]
  provider = "sglang-direct"
  model    = "gemma4-26b"

[agents.reviewer]
  provider = "sglang-direct"
  model    = "gemma4-26b"

[agents.fixer]
  provider = "sglang-direct"
  model    = "gemma4-26b"

[agents.supervisor]
  effort = "low"

[agents.interactive_supervisor]
  effort = "medium"

[direct_tool_agent]
  enabled        = true
  endpoint       = "http://localhost:8081/v1/chat/completions"
  model          = "gemma4-26b"
  max_tokens     = 8192
  temperature    = 0.1
  timeout        = "180s"
  max_iterations = 20
  bash_timeout   = "60s"

[watcher]
  db_path             = "~/.drem-csuite/watcher.db"
  inbox_base_dir      = "~/.drem-csuite"
  allowed_agents      = ["mike", "alex", "ross", "seth"]
  prompt_dir          = "docs/csuite-agents/prompts"
  inbox_poll_interval = "2s"
  safety_interval     = "5m"
  heartbeat_interval  = "30s"

[serve]
  listen_addr  = ":8080"
  bearer_token = "drem-local-dev"
  db_path      = "~/.drem-csuite/csuite.db"
