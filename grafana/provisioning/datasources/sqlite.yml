apiVersion: 1

datasources:
  - name: DremDB
    type: frser-sqlite-datasource
    uid: drem-sqlite
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      path: /var/lib/grafana/drem.db
  - name: CsuiteDB
    type: frser-sqlite-datasource
    uid: csuite-sqlite
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      path: /var/lib/grafana/csuite.db
